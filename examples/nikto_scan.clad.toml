# nikto_scan.clad.toml — Web server vulnerability scanner
#
# Demonstrates custom types from the project-level toolclad.toml:
#   port_range, service_protocol, scan_rate
#
# The CLIs discover toolclad.toml by walking up from this file's directory, so
# the custom types resolve both from the library and from `toolclad validate`.
#
# `target` is a built-in `scope_target` rather than the custom `hostname` type:
# a custom type cannot carry `block_internal`, so an egress tool whose target is
# a custom type has no SSRF defense. Keep network targets on the built-in types.
#
# `human_approval = true` is enforced: the default policy gate refuses this tool
# unless the caller supplies an approving gate (`--approve` on the CLIs).

[tool]
name = "nikto_scan"
version = "1.0.0"
binary = "nikto"
description = "Scan a web server for known vulnerabilities and misconfigurations"
timeout_seconds = 600
risk_tier = "medium"
human_approval = true
network_egress = true

[tool.cedar]
resource = "PenTest::ScanTarget"
action = "execute_tool"

[args.target]
position = 1
required = true
type = "scope_target"
block_internal = true
description = "Target hostname to scan"

[args.port]
position = 2
required = false
type = "port_range"
default = "80"
description = "Port or port range (e.g. 80, 443, 8080-8090)"

[args.protocol]
position = 3
required = false
type = "service_protocol"
default = "http"
description = "Protocol to use for the scan"

[args.max_rate]
position = 4
required = false
type = "scan_rate"
default = 100
description = "Maximum requests per second"

[args.output_format]
position = 5
required = false
type = "enum"
allowed = ["text", "csv", "json", "xml"]
default = "json"
description = "Output format"

[command]
exec = [
    "nikto",
    "-h", "{protocol}://{target}:{port}",
    "-maxtime", "{maxtime}",
    "-Format", "{output_format}",
    "{_rate_flag}",
]

[command.defaults]
maxtime = "600s"

[command.conditionals.rate_flag]
when = "max_rate != '100'"
template = "-Plugins @@ALL -maxrate {max_rate}"

[output]
format = "json"
parser = "builtin:json"
envelope = true
max_bytes = 8388608

[output.schema]
type = "object"

[output.schema.properties.vulnerabilities]
type = "array"
description = "List of discovered vulnerabilities"

[output.schema.properties.host]
type = "string"
description = "Target host that was scanned"

[output.schema.properties.port]
type = "integer"
description = "Port that was scanned"
