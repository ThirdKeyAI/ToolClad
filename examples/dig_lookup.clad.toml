# ToolClad manifest: DNS lookup via dig
# Demonstrates: enum type for record types, array-form command construction

[tool]
name = "dig_lookup"
version = "1.0.0"
binary = "dig"
description = "DNS record lookup"
timeout_seconds = 15
risk_tier = "low"

[tool.cedar]
resource = "Tool::DnsLookup"
action = "execute_tool"

[args.target]
position = 1
required = true
type = "scope_target"
description = "Domain name to query"

[args.record_type]
position = 2
required = false
type = "enum"
allowed = ["A", "AAAA", "MX", "NS", "TXT", "CNAME", "SOA", "PTR", "SRV", "ANY"]
default = "A"
description = "DNS record type"

# `+short` is a literal argv element declared by the manifest. A `scope_target`
# value can never begin with `+` or `-`, so an argument cannot become an option.
[command]
exec = ["dig", "+short", "{target}", "{record_type}"]

[output]
format = "text"
envelope = true
max_bytes = 8388608

[output.schema]
type = "object"

[output.schema.properties.raw_output]
type = "string"
description = "DNS query results"
