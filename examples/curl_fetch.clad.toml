# ToolClad manifest: HTTP request via curl
# Demonstrates: url type with scope check, enum for methods, conditionals,
# and `allow_whitespace` for a value that legitimately contains spaces.
#
# `scope_check = true` resolves against scope/scope.toml, searched upward from
# this file's directory. The repository ships a starter scope file allowing
# example.com and its subdomains, so:
#
#   toolclad test examples/curl_fetch.clad.toml --arg url=https://example.com/
#
# succeeds while any other host is refused. Scope enforcement is fail-closed:
# with no scope file in reach, the call is refused rather than allowed.

[tool]
name = "curl_fetch"
version = "1.0.0"
binary = "curl"
description = "HTTP request with headers and response capture"
timeout_seconds = 30
risk_tier = "low"
network_egress = true

[tool.cedar]
resource = "Tool::HttpFetch"
action = "execute_tool"

[args.url]
position = 1
required = true
type = "url"
schemes = ["http", "https"]
scope_check = true
# curl fetches this URL — default-deny internal/SSRF hosts (loopback, private,
# cloud metadata). Use an allowlist if internal fetches are genuinely required.
block_internal = true
description = "URL to fetch"

[args.method]
position = 2
required = false
type = "enum"
allowed = ["GET", "HEAD", "POST", "PUT", "DELETE", "OPTIONS"]
default = "GET"
description = "HTTP method"

[args.headers]
position = 3
required = false
type = "string"
sanitize = ["injection"]
# A header line is "Key: Value", so a space is part of the value. In the array
# form the value stays exactly one argv element, so permitting whitespace here
# cannot add arguments. Quotes, control characters and a leading dash are still
# refused.
allow_whitespace = true
default = ""
description = "One extra header as 'Key: Value'"

[command]
exec = [
    "curl",
    "-s", "-S",
    "-X", "{method}",
    "--max-time", "25",
    "-w", "\\n%{{http_code}}",
    "{_header_flags}",
    "{url}",
]

# `{{` and `}}` above are escapes for literal braces: curl receives the
# write-out format `\n%{http_code}`, not a ToolClad placeholder.

[command.conditionals]
header_flags = { when = "headers != ''", template = "-H {headers}" }

[output]
format = "text"
envelope = true
max_bytes = 8388608

[output.schema]
type = "object"

[output.schema.properties.raw_output]
type = "string"
description = "HTTP response body"
