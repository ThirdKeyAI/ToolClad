[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "toolclad"
version = "0.6.2"
description = "Declarative tool interface contracts for agentic runtimes — typed parameters, command templates, evidence envelopes, session and browser modes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai", "agents", "tools", "security", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
authors = [
    {name = "Jascha Wanger / ThirdKey AI"},
]
dependencies = [
    "tomli>=2.0.1; python_version < '3.11'",
    "click>=8.1.3",
]

[project.urls]
Homepage = "https://github.com/ThirdKeyAI/ToolClad"
Repository = "https://github.com/ThirdKeyAI/ToolClad"
Documentation = "https://github.com/ThirdKeyAI/ToolClad/blob/main/TOOLCLAD_DESIGN_SPEC.md"

[project.optional-dependencies]
# Exact, hash-pinned versions for CI and local development live in
# requirements-dev.lock; these are the compatible lower bounds.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[project.scripts]
toolclad = "toolclad.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
