# Project-level custom type definitions for ToolClad.
#
# Types defined here can be referenced by any .clad.toml manifest
# in this project using type = "custom_type_name".
#
# Each custom type inherits validation from a base type and adds
# constraints (allowed values, patterns, min/max ranges).
#
# Custom types cannot carry the per-argument egress policy (`block_internal`)
# or scope enforcement (`scope_check`). An argument that names a network target
# must therefore use the built-in `scope_target`, `url`, `ip_address`, or
# `cidr` type — a manifest that dispatches a network-egress binary with a
# custom-typed target is refused at load.
#
# `pattern` is anchored: the value must match the whole string, so `[a-z]+`
# means `^(?:[a-z]+)$` and not a substring search.

[types.severity_level]
base = "enum"
allowed = ["info", "low", "medium", "high", "critical"]

[types.service_protocol]
base = "enum"
allowed = ["ssh", "ftp", "http", "https", "smtp", "dns", "rdp", "smb", "telnet", "snmp"]

[types.scan_rate]
base = "integer"
min = 1
max = 10000

# Shape-only hostname check. Prefer the built-in `scope_target` type for
# anything that is actually dialed: this type carries no egress or scope policy.
[types.hostname]
base = "string"
pattern = "^[a-zA-Z0-9]([a-zA-Z0-9\\-]*[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9\\-]*[a-zA-Z0-9])?)*$"

[types.safe_identifier]
base = "string"
pattern = "^[a-zA-Z_][a-zA-Z0-9_\\-]{0,63}$"

[types.port_range]
base = "string"
pattern = "^\\d{1,5}(-\\d{1,5})?(,\\d{1,5}(-\\d{1,5})?)*$"
