[package]
name = "toolclad-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.toolclad]
path = ".."

# Keep this crate out of any parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "validate_arg"
path = "fuzz_targets/validate_arg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_manifest"
path = "fuzz_targets/parse_manifest.rs"
test = false
doc = false
bench = false
